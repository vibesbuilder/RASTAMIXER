; Overlay Mixer - configuration
;
; Copy this file to "overlay_mixer.ini" in the same folder as overlay_mixer_watchdog.py
; and adjust it. Settings you leave out keep their built-in default (the values below,
; except the folders). Restart the mixer after every change.
;
; Notes
; - Comments go on their own line (starting with ; or #), never behind a value.
; - Put a value in double quotes to keep leading/trailing spaces or to set an empty text: ""
; - Environment variables such as %USERPROFILE% are expanded in paths.
; - Without overlay_mixer.ini the mixer uses the folders input, atmo, output, error and
;   archive next to the script and logs a warning.
; - Unknown settings or invalid values stop the mixer at startup (see the log).

[paths]
; Folder that is watched for new overlays (spoken announcements)
input_dir = %USERPROFILE%\Announcements\Input
; Folder with the background music beds ("atmo"), *.mp3 of different lengths
atmo_dir = D:\Audio\Atmo
; Where the finished MP3 files are written, e.g. the import folder of the playout software
output_dir = D:\Audio\Import
; Overlays that could not be processed are moved here
error_dir = D:\Audio\Error
; Processed overlays are moved here
archive_dir = D:\Audio\Archive
; Second log file, e.g. on a network share. A local log is always written to
; logs\overlay_mixer.log next to the script.
log_file = D:\Audio\overlay_mixer.log

[programs]
; FFmpeg and ffprobe: command name (if in PATH) or full path
ffmpeg = ffmpeg
ffprobe = ffprobe

[mix]
; The overlay starts this many seconds after the atmo
leadin_seconds = 5
; Minimum atmo length = overlay + leadin_seconds + buffer_seconds (the shortest atmo that fits is used)
buffer_seconds = 2
; MP3 bit rate of the output
bitrate = 320k

[output]
; Prefix of every output file name. A name that already starts with it gets it only once.
prefix = "VAH "

[tags]
; If the overlay file name contains a date (YYYYMMDD or YYYY-MM-DD), two ID3 TXXX tags are
; written for the playout software: enable date = date - enable_days_before,
; expiry date = date + expiry_days_after.
enable_date_tag = Enable Date
expiry_date_tag = Expiry Date
enable_days_before = 14
expiry_days_after = 1
; Python strftime format of the two date tags
date_format = %Y-%m-%d
; ID3 media type (frame TMED) of every file; empty = none
media_type = News
; Fixed text for every file: text_field = Album (TALB), Genre (TCON), Comment (COMM)
; or a custom name (-> TXXX frame); empty text = none
text_field = Album
text = Veranstaltungshinweis
; Language code (ISO 639-2) of the comment frame, only for text_field = Comment
comment_language = deu

[loudness]
; Quiet voice tracks are raised before mixing (never lowered): measured according to
; EBU R128; if more than tolerance_lu below target_lufs, the lows below highpass_hz are
; removed, the track is amplified to the target (at most max_gain_db) and peaks are
; limited to peak_limit_db. target_lufs = off disables it.
target_lufs = -18
tolerance_lu = 1
peak_limit_db = -2
; 0 = no high-pass filter
highpass_hz = 80
max_gain_db = 20
